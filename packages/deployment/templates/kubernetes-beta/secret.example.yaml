apiVersion: v1
kind: Secret
metadata:
  name: grepmind-runtime-secrets
  labels:
    app.kubernetes.io/name: grepmind
    grepmind.zaytra.dev/deployment-context: beta
type: Opaque
stringData:
  DATABASE_URL: <postgresql-url>
  CLERK_SECRET_KEY: <clerk-secret-key>
  VOYAGE_API_KEY: <voyage-api-key>
  GREPMIND_REDIS_URL: <upstash-redis-compatible-url>
  GREPMIND_S3_ACCESS_KEY: <s3-access-key>
  GREPMIND_S3_SECRET_KEY: <s3-secret-key>
