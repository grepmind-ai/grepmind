apiVersion: batch/v1
kind: Job
metadata:
  name: grepmind-migrate
  labels:
    app.kubernetes.io/name: grepmind
    app.kubernetes.io/component: migration
    grepmind.zaytra.dev/deployment-context: beta
    grepmind.zaytra.dev/runtime-revision: <phase-09-runtime-revision>
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grepmind
        app.kubernetes.io/component: migration
        grepmind.zaytra.dev/deployment-context: beta
        grepmind.zaytra.dev/runtime-revision: <phase-09-runtime-revision>
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/zaytra-labs/grepmind-app:<phase-09-image-tag>
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "db:migrate"]
          envFrom:
            - secretRef:
                name: grepmind-runtime-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/grepmind/config.yml
              subPath: config.yml
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: grepmind-config
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
