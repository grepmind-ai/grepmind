apiVersion: apps/v1
kind: Deployment
metadata:
  name: grepmind-app
  labels:
    app.kubernetes.io/name: grepmind
    app.kubernetes.io/component: app
    grepmind.zaytra.dev/process-role: app
    grepmind.zaytra.dev/deployment-context: beta
    grepmind.zaytra.dev/runtime-revision: <phase-09-runtime-revision>
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grepmind
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grepmind
        app.kubernetes.io/component: app
        grepmind.zaytra.dev/process-role: app
        grepmind.zaytra.dev/deployment-context: beta
        grepmind.zaytra.dev/runtime-revision: <phase-09-runtime-revision>
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/grepmind-ai/grepmind-app:<phase-09-image-tag>
          imagePullPolicy: IfNotPresent
          command:
            - node
            - packages/app/dist/index.js
            - --config
            - /etc/grepmind/config.yml
            - --host
            - 0.0.0.0
            - --port
            - '3847'
          ports:
            - name: http
              containerPort: 3847
          env:
            - name: GREPMIND_PROCESS_ROLE
              value: app
            - name: GREPMIND_APP_DB_POOL_MAX
              value: '5'
            # The app role only uses GREPMIND_APP_DB_POOL_MAX for its own
            # PostgreSQL pool, but beta startup validates the whole cluster DB
            # budget in every pod. Keep worker/dbos maxima in sync with the
            # worker Deployment when changing these values.
            - name: GREPMIND_WORKER_DB_POOL_MAX
              value: '5'
            - name: GREPMIND_DBOS_DB_POOL_MAX
              value: '5'
            - name: GREPMIND_APP_REPLICA_BUDGET
              value: '2'
            - name: GREPMIND_WORKER_REPLICA_BUDGET
              value: '1'
            - name: GREPMIND_NEON_CONNECTION_CAP
              value: '<neon-connection-cap>'
            - name: GREPMIND_DB_CONNECTION_RESERVED
              value: '5'
            - name: GREPMIND_DB_CONNECTION_HEADROOM_PERCENT
              value: '20'
            - name: GREPMIND_DEPLOYMENT_CONTEXT
              value: beta
            - name: GREPMIND_SERVER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: grepmind-runtime-secrets
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/grepmind/config.yml
              subPath: config.yml
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      volumes:
        - name: config
          configMap:
            name: grepmind-config
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
