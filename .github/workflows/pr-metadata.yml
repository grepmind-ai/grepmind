name: PR Metadata

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: Validate PR title and description
    runs-on: ubuntu-latest

    steps:
      - name: Checkout policy scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate PR metadata
        run: node tools/validate-pr-metadata.mjs
